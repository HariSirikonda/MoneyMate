{% extends "base.html" %}
{% block title %}Delete Transaction | MoneyMate{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4 text-center">
<h3>Delete transaction?</h3>
<p class="text-muted">You are about to delete <strong>{{ transaction.name }}</strong> for ₹{{ transaction.amount|floatformat:2 }}.</p>
<form method="post">
{% csrf_token %}
<a href="{% url 'transactions' %}" class="btn btn-light">Cancel</a>
<button class="btn btn-danger" type="submit">Yes, delete</button>
</form>
</div>
</div>
</div>
{% endblock %}
