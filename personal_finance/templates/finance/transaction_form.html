{% extends "base.html" %}
{% block title %}{{ title }} | MoneyMate{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
<div class="card p-4">
<h3 class="mb-4">{{ title }}</h3>
<form method="post">
{% csrf_token %}
{% for field in form %}
<div class="mb-3">
<label class="form-label fw-semibold">{{ field.label }}</label>
{{ field }}
{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
</div>
{% endfor %}
<div class="d-flex gap-2">
<a href="{% url 'transactions' %}" class="btn btn-light">Cancel</a>
<button class="btn btn-primary" type="submit">Save transaction</button>
</div>
</form>
</div>
</div>
</div>
{% endblock %}
