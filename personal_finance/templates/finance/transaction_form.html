{% extends "base.html" %}

{% block title %}{{ title }} | MoneyMate{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card p-3">
            <h5 class="mb-3">{{ title }}</h5>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-2">

                    <label class="form-label fw-semibold mb-1">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                    <div class="text-danger small">
                        {{ field.errors|striptags }}
                    </div>
                    {% endif %}

                </div>
                {% endfor %}

                <div class="d-flex gap-2 mt-2">
                    <a href="{% url 'transactions' %}" class="btn btn-light btn-sm">
                        Cancel
                    </a>

                    <button class="btn btn-primary btn-sm" type="submit">
                        Save transaction
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

{% endblock %}
