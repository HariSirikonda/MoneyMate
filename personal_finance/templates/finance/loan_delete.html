{% extends "base.html" %}
{% block title %}Delete Loan | MoneyMate{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h3>Delete Loan?</h3>
            <p class="text-muted">
                You are about to delete
                <strong>{{ loan.loan_name }}</strong>
                for <strong>₹{{loan.principal_amount}}</strong>
            </p>
            <form method="post">
                {% csrf_token %}
                <a href="{{request.META.HTTP_REFERER}}" class="btn btn-light">Cancel</a>
                <button class="btn btn-danger" type="submit">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
