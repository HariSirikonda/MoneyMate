<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MoneyMate{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .navbar-brand { font-weight: 700; letter-spacing: .3px; }
        .card { border: 0; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.05); }
        .month-card { transition: .2s; cursor: pointer; }
        .month-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.10); }
        .stat-value { font-size: 1.55rem; font-weight: 700; }
        .small-muted { color: #6c757d; font-size: .86rem; }
        .positive { color: #198754; }
        .negative { color: #dc3545; }
        .category-bar { height: 8px; border-radius: 20px; background: #e9ecef; }
        .category-bar > div { height: 100%; border-radius: 20px; background: #0d6efd; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">MoneyMate</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" href="{% url 'transactions' %}">Transactions</a>
            <a class="btn btn-primary btn-sm" href="{% url 'add_transaction' %}">+ Add</a>
            <span class="text-light small ms-2">Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
            {{ message }}
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
